general:
  project_name: raman_linear_softmax_prediction_host
  logs_dir: logs
  saved_models_dir: saved_models
  display_figures: false
  global_seed: 20260805
  gpu_memory_limit: 4
  deterministic_ops: true

model:
  model_path: ${RAMAN_PROJECT_ROOT}/artifacts/model_zoo/linear_softmax/quantization/quantized_models/quantized_model.tflite
  model_name:

operation_mode: prediction

dataset:
  dataset_name: afd_test_bench
  class_names: [TEP, DIMP, DMMP]
  training_path:
  validation_path:
  test_path:
  quantization_path:
  prediction_path: ${RAMAN_PROJECT_ROOT}/data/processed/prediction.csv
  test_split:
  validation_split:
  quantization_split:
  to_cache: true
  seed: 20260805

preprocessing:
  # The CSV is already SNV-normalized, clipped to +/-8 sigma, and divided by 8.
  downsampling: false
  normalization: false
  time_domain: true

prediction:
  target: host
  profile: profile_O3
  input_type: float32
  output_type: float32
  input_chpos: chlast
  output_chpos: chlast

mlflow:
  uri: ${RAMAN_PROJECT_ROOT}/artifacts/model_zoo/mlruns

hydra:
  run:
    dir: ${oc.env:RAMAN_PROJECT_ROOT}/artifacts/model_zoo/linear_softmax/prediction_host
